workflows:
  debug-manual:
    name: Android Debug APK (manual)
    # No automatic triggers so this workflow is started manually from the Codemagic UI.
    max_build_duration: 60
    environment:
      vars: {}
    scripts:
      - name: Verify repository and Gradle configuration
        script: |
          echo "Checking repository layout and Gradle configuration..."

          # Ensure Gradle wrapper exists (attempt to regenerate it if missing by installing system Gradle)
          if [ -x ./gradlew ]; then
            echo "Using existing Gradle wrapper (./gradlew)"
          else
            if [ -f ./gradlew ]; then
              chmod +x ./gradlew
              echo "Made ./gradlew executable"
            else
              echo "Gradle wrapper (./gradlew) not found. Attempting to regenerate using system Gradle..."

              # Try to use system 'gradle' if available to run 'gradle wrapper'. If not available, try to install Gradle via apt.
              if command -v gradle >/dev/null 2>&1; then
                echo "System Gradle detected. Generating wrapper..."
                gradle wrapper --gradle-version 8.7 || true
              else
                echo "System Gradle not found. Installing Gradle via apt (non-interactive)..."
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -y && apt-get install -y gradle || true
                if command -v gradle >/dev/null 2>&1; then
                  echo "Gradle installed. Generating wrapper..."
                  gradle wrapper --gradle-version 8.7 || true
                else
                  echo "ERROR: Unable to install or detect Gradle. Please add the Gradle wrapper to the repository (gradlew + gradle/wrapper/gradle-wrapper.jar)."
                  exit 1
                fi
              fi

              if [ -f ./gradlew ]; then
                chmod +x ./gradlew
                echo "Generated Gradle wrapper (./gradlew)"
              else
                echo "ERROR: Failed to generate Gradle wrapper. Please commit gradlew and gradle/wrapper/gradle-wrapper.jar to the repository."
                exit 1
              fi
            fi
          fi

          # Ensure app module exists in settings (robust check for ':app' in settings file)
          if [ -f settings.gradle.kts ]; then
            if ! grep -Eq "['\"]:app['\"]" settings.gradle.kts; then
              echo "ERROR: settings.gradle.kts does not include ':app' — expected Android module 'app'."
              exit 1
            fi
          elif [ -f settings.gradle ]; then
            if ! grep -Eq "['\"]:app['\"]" settings.gradle; then
              echo "ERROR: settings.gradle does not include ':app' — expected Android module 'app'."
              exit 1
            fi
          else
            echo "ERROR: No settings.gradle(.kts) found. Cannot determine modules."
            exit 1
          fi

          # Ensure app build file exists
          if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
            echo "ERROR: app/build.gradle(.kts) not found. Ensure Android module 'app' is present."
            exit 1
          fi

          echo "Repository checks passed."

      - name: Print Java & Gradle-wrapper information (and enforce Java 17)
        script: |
          echo "Checking Java version (require Java 17)..."
          if command -v java >/dev/null 2>&1; then
            if java -version 2>&1 | grep -E '"17' >/dev/null 2>&1; then
              echo "Java 17 detected:"; java -version 2>&1 | sed -n '1,2p'
            else
              echo "ERROR: Java 17 is required by this project. Detected:"; java -version 2>&1
              echo "If Codemagic's default image does not provide Java 17, open the app settings in Codemagic and select an image with Java 17 or configure a custom image."
              exit 1
            fi
          else
            echo "ERROR: 'java' not found in PATH. Ensure the Codemagic image provides Java 17 or configure the app environment appropriately."
            exit 1
          fi

          echo "Gradle (wrapper) info:"; ./gradlew --version || true

      - name: Clean
        script: |
          ./gradlew --no-daemon clean

      - name: Assemble Debug APK
        script: |
          set -euo pipefail
          echo "Starting assembleDebug (this will fail the build if Gradle/Android SDK are misconfigured)"
          ./gradlew --no-daemon clean assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk

  release-placeholder:
    name: Release (configure signing later)
    max_build_duration: 120
    environment:
      vars: {}
    scripts:
      - name: Prepare for release (no signing configured)
        script: |
          echo "Release workflow present but signing is not configured. Configure signing environment variables in Codemagic to enable releases."
    artifacts:
      - app/build/outputs/**/*.apk

# Notes:
# - The ':app' check searches for the string ':app' with either single or double quotes
#   anywhere in the settings.gradle(.kts) file. This avoids false negatives due to whitespace or formatting.
# - The Verify step now attempts to regenerate the Gradle wrapper using a system Gradle installation if
#  the wrapper is missing. It will try to detect 'gradle' on PATH and, failing that, install Gradle via apt.
# - If regeneration fails, the step will fail with a clear message instructing the maintainer to commit the
#   Gradle wrapper files (gradlew + gradle/wrapper/gradle-wrapper.jar).
# - The workflow enforces Java 17 at runtime and will fail early with a clear message if the CI image
#   does not provide Java 17 or if Gradle/Android configuration is invalid.
# - The Gradle wrapper (./gradlew) is used for all build tasks once available.
